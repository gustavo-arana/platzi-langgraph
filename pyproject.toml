[project]
name = "platzi-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gustavo Arana Osorio", email = "gustavo.arana91@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "langchain>=1.3.16",
    "langchain-anthropic>=1.6.1",
    "langchain-google-genai>=4.3.5",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
]

[project.scripts]
platzi-langgraph = "platzi_langgraph:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grandalf>=0.8",
    "ipykernel>=7.3.0",
    "langgraph-cli[inmem]>=0.4.31",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
